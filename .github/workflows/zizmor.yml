name: zizmor

# Audits the GitHub Actions workflows with zizmor and fails on any
# high-severity finding. To accept a finding, add `# zizmor: ignore[<rule>]`
# to the reported line, with the reason in a comment above it.
on:
  pull_request:
    paths:
      - '.github/**'
  push:
    branches: [main]
    paths:
      - '.github/**'
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Installs exactly this zizmor release from hash-pinned wheels and runs
      # it offline over .github; findings print to the log only.
      - name: Audit workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: '1.31.1'
          inputs: .github
          online-audits: false
          min-severity: high
          advanced-security: false
