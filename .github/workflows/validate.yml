name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-skills:
    name: Agent Skills spec validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate SKILL.md files with skills-ref
        run: |
          set -euo pipefail
          python3 -m pip install 'skills-ref>=0.1.1'
          failed=0
          for d in skills/*/; do
            echo "Validating ${d}..."
            agentskills validate "${d}" || failed=1
          done
          exit "${failed}"

  validate-plugin-manifest:
    name: Claude Code plugin manifest schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check plugin.json and marketplace.json are valid JSON
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Verify required plugin.json fields
        run: |
          python3 - <<'PY'
          import json, sys
          m = json.load(open('.claude-plugin/plugin.json'))
          required = ['name', 'description', 'version', 'author', 'repository']
          missing = [k for k in required if k not in m]
          if missing:
              print(f'Missing required fields in plugin.json: {missing}')
              sys.exit(1)
          print('plugin.json has all required fields')
          PY

  link-check:
    name: Verify docs.k-id.com links referenced in SKILL.md files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract and check docs.k-id.com links
        run: |
          set -euo pipefail
          urls=$(grep -rhoE 'https://docs\.k-id\.com/[A-Za-z0-9_./#-]+' skills/ | sort -u)
          echo "Checking $(echo "$urls" | wc -l) unique docs.k-id.com URLs"
          failed=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            status=$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 -L "$url" || echo "000")
            if [ "$status" != "200" ]; then
              echo "FAIL ($status): $url"
              failed=$((failed + 1))
            fi
          done <<< "$urls"
          if [ "$failed" -gt 0 ]; then
            echo "$failed broken link(s) found"
            exit 1
          fi
          echo "All docs.k-id.com links OK"

  validate-description-length:
    name: SKILL.md description byte limit (ChatGPT)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check descriptions are <= 1024 UTF-8 bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          def parse_description(text: str) -> str:
              fm = re.match(r'^---\n(.*?)\n---', text, re.S)
              if not fm:
                  raise ValueError('missing frontmatter')
              block = fm.group(1)
              folded = re.search(r'^description:\s*>-\n((?:  .+\n)+)', block, re.M)
              if folded:
                  lines = [re.sub(r'^  ', '', ln) for ln in folded.group(1).splitlines() if ln.strip()]
                  return ' '.join(lines)
              quoted = re.search(r'^description:\s*"(.*)"\s*$', block, re.M)
              if quoted:
                  return quoted.group(1)
              plain = re.search(r'^description:\s*(.+)$', block, re.M)
              if plain:
                  return plain.group(1).strip().strip('"').strip("'")
              raise ValueError('missing description')

          failed = 0
          for skill_md in sorted(Path('skills').glob('*/SKILL.md')):
              if skill_md.parent.name.startswith('k-id-'):
                  continue  # k-ID integration skills are not packaged for ChatGPT upload
              text = skill_md.read_text(encoding='utf-8')
              desc = parse_description(text)
              size = len(desc.encode('utf-8'))
              print(f'{skill_md.parent.name}: {size} bytes')
              if size > 1024:
                  print(f'  FAIL: exceeds 1024-byte limit by {size - 1024}')
                  failed += 1
          sys.exit(failed)
          PY
